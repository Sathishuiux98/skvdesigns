<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Sathishkumar V</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/base.css">
<style>
:root{--ink:#0F0D0D;--mute:#6B6B66;--bg:#FFFFFF;--line:#E4E4E0;--y:#FFD105}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F2F2EE;--mute:#A3A39C;--bg:#0F0F0F;--line:#2C2C2C}}
:root[data-theme="dark"]{--ink:#F2F2EE;--mute:#A3A39C;--bg:#0F0F0F;--line:#2C2C2C}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box}
main{max-width:560px;width:100%}
.k{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--y);color:#0F0D0D;font:700 15px/1 Inter,sans-serif;margin-bottom:28px}
h1{font:500 clamp(40px,8vw,64px)/1.05 Inter,sans-serif;letter-spacing:-.035em;margin:0 0 16px}
p{font-size:17px;line-height:27px;color:var(--mute);margin:0 0 32px}
.row{display:flex;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:999px;font:500 15px/1 Inter,sans-serif;text-decoration:none;transition:background-color .3s,box-shadow .3s}
.pri{background:var(--y);color:#0F0D0D}
.sec{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.sec:hover{box-shadow:inset 0 0 0 1px var(--mute)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
<span class="k" aria-hidden="true">404</span>
<h1>This page isn’t here.</h1>
<p>The link may be old or mistyped. The work is still a click away.</p>
<div class="row"><a class="pri" href="/">Go to home</a><a class="sec" href="/#work">See selected work</a><a class="sec" href="/interactions">Interactions</a></div>
</main>
<script>try{var t=localStorage.getItem('pf-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</body>
</html>
